app = "kiirox-api"
primary_region = "gru" # São Paulo (same region as Neon sa-east-1)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4000"
  CORS_ORIGINS = "*"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  grace_period = "30s"
  interval = "15s"
  method = "GET"
  timeout = "10s"
  path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
